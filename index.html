<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Butter — Smooth Execution. Sharp Logic.</title>
  <link rel="icon" type="image/png" href="images/favicon-lb.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    /* 1. FONT DEFINITIONS - Corrected Paths */
    @font-face {
      font-family: 'Boldesqo Serif Decore';
      src: url('fonts/Boldesqo.woff2') format('woff2'), url('fonts/Boldesqo.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Brim Narrow';
      src: url('fonts/Brim-Narrow.woff2') format('woff2'), url('fonts/Brim-Narrow.ttf') format('truetype');
      font-weight: bold;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --lb-gradient: linear-gradient(135deg, #F4EA0D 0%, #F29406 33%, #D52424 66%, #953838 100%);
    }

    /* 2. THE GLOBAL GRADIENT - No more Grey */
    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      background: var(--lb-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent; /* Fallback */
    }

    /* Force Backgrounds back to Black since * selector hits everything */
    html, body, section, div, nav, footer {
      background-clip: border-box;
      -webkit-text-fill-color: initial;
      background-image: none;
      background-color: var(--bg);
    }

    /* Target all text elements for the 4-stage gradient */
    p, h1, h2, h3, h4, span, a, li, button {
      background: var(--lb-gradient) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      display: inline-block; /* Required for clipping in some browsers */
    }

    body {
      font-family: 'Brim Narrow', sans-serif;
      font-weight: bold;
      background: var(--bg);
      overflow-x: hidden;
    }

    h1, h2, h3 { font-family: 'Boldesqo Serif Decore', serif; text-transform: uppercase; }

    /* 3. NAVIGATION - Mascot as Burger/Menu */
    nav {
      position: fixed; top: 0; width: 100%; height: 100px;
      z-index: 1000; background: var(--bg);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%; border-bottom: 2px solid #F4EA0D;
    }

    .nav-mascot {
      height: 70px; cursor: pointer;
      -webkit-text-fill-color: initial !important; /* Don't apply gradient to image */
    }

    .nav-links { display: flex; gap: 3rem; }
    .nav-links a { font-size: 1.2rem; text-decoration: none; letter-spacing: 2px; }

    /* 4. THE HERO - Logic Butter Attraction */
    .hero {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }

    .hero-logo { width: 300px; margin-bottom: 2rem; }

    .hero h1 {
      font-size: clamp(4rem, 15vw, 9rem);
      margin-bottom: 1rem;
      line-height: 0.9;
    }

    .hero p { font-size: 1.8rem; max-width: 800px; }

    .axiom-link {
      margin-top: 3rem; font-size: 1.5rem;
      border: 1px solid #D52424; padding: 1rem 3rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="/"><img src="images/logic-butter-mascot.png" class="nav-mascot" alt="Menu"></a>
    <div class="nav-links">
      <a href="#workshop">Workshop</a>
      <a href="#silo">Silo</a>
      <a href="https://axiomite.dev" target="_blank">Axiomite.dev</a>
    </div>
  </nav>

  <section class="hero">
    <img src="images/logic-butter-banner.png" class="hero-logo" alt="Logic Butter">
    <h1>LOGIC<br>BUTTER</h1>
    <p>Every word, every letter, every execution is rendered in the Sovereign Gradient. No filler. No gray. Sharp Logic.</p>
    <a href="https://axiomite.dev" class="axiom-link">ENTER AXIOMITE</a>
  </section>

</body>
</html>
